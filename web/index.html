<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#102445" />
    <title>Students Academy, Grant Road — Coaching for 9th–12th, CET, JEE & NEET</title>
    <meta name="description" content="Students Academy, Grant Road (West), Mumbai — coaching for SSC 9th & 10th, FYJC/SYJC Science & Commerce, Information Technology, Computer Science, Electronics and MHT-CET / JEE / NEET. Founded by Mr. Vishal Khandekar Sir." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Preloader: shown instantly while the app loads, removed by src/main.jsx */
      #sa-preloader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#fff;transition:opacity .55s ease,visibility .55s ease}
      #sa-preloader.done{opacity:0;visibility:hidden}
      #sa-preloader .pl-wrap{display:flex;flex-direction:column;align-items:center;gap:22px}
      #sa-preloader .pl-mark{position:relative;width:112px;height:112px}
      #sa-preloader .pl-ring{position:absolute;inset:0;transform:rotate(-90deg)}
      #sa-preloader .pl-ring circle{fill:none;stroke-width:4;stroke-linecap:round}
      #sa-preloader .pl-track{stroke:#e8edf6}
      #sa-preloader .pl-arc{stroke:#e11d2e;stroke-dasharray:327;stroke-dashoffset:327;animation:pl-draw 1.4s cubic-bezier(.65,0,.35,1) infinite}
      #sa-preloader .pl-arc2{stroke:#102445;stroke-dasharray:327;stroke-dashoffset:327;animation:pl-draw 1.4s cubic-bezier(.65,0,.35,1) .7s infinite;opacity:.9}
      #sa-preloader .pl-logo{position:absolute;inset:16px;border-radius:24px;background:linear-gradient(135deg,#17305d,#0b1a33);display:grid;place-items:center;box-shadow:0 18px 40px -14px rgba(16,36,69,.55);animation:pl-pop .7s cubic-bezier(.16,1,.3,1) both}
      #sa-preloader .pl-logo svg{width:44px;height:44px;animation:pl-bob 1.6s ease-in-out infinite}
      #sa-preloader .pl-name{font:700 26px/1.1 Georgia,'Times New Roman',serif;color:#0b1a33;letter-spacing:.2px;overflow:hidden;white-space:nowrap}
      #sa-preloader .pl-name span{display:inline-block;opacity:0;transform:translateY(100%);animation:pl-up .6s cubic-bezier(.16,1,.3,1) forwards}
      #sa-preloader .pl-sub{margin-top:6px;font:600 11px/1 system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#64748b;text-align:center;opacity:0;animation:pl-fade .6s .55s forwards}
      #sa-preloader .pl-bar{width:180px;height:3px;border-radius:9px;background:#eef2f8;overflow:hidden}
      #sa-preloader .pl-bar i{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,#102445,#2563eb,#e11d2e);animation:pl-slide 1.1s ease-in-out infinite}
      @keyframes pl-draw{0%{stroke-dashoffset:327}50%{stroke-dashoffset:0}100%{stroke-dashoffset:-327}}
      @keyframes pl-pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
      @keyframes pl-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes pl-up{to{opacity:1;transform:none}}
      @keyframes pl-fade{to{opacity:1}}
      @keyframes pl-slide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
      @media (prefers-reduced-motion:reduce){#sa-preloader *{animation-duration:0s!important;animation-iteration-count:1!important}}
    </style>
  </head>
  <body>
    <div id="sa-preloader" role="status" aria-label="Loading Students Academy">
      <div class="pl-wrap">
        <div class="pl-mark">
          <svg class="pl-ring" viewBox="0 0 112 112"><circle class="pl-track" cx="56" cy="56" r="52"/><circle class="pl-arc" cx="56" cy="56" r="52"/><circle class="pl-arc2" cx="56" cy="56" r="52"/></svg>
          <div class="pl-logo"><svg viewBox="0 0 64 64"><path d="M8 24 32 13l24 11-24 11z" fill="#e11d2e"/><path d="M17 30v10c0 5 7 9 15 9s15-4 15-9V30l-15 7z" fill="#fff"/><rect x="53" y="24" width="3" height="15" rx="1.5" fill="#e11d2e"/></svg></div>
        </div>
        <div><div class="pl-name"><span style="animation-delay:0.150s">S</span><span style="animation-delay:0.185s">t</span><span style="animation-delay:0.220s">u</span><span style="animation-delay:0.255s">d</span><span style="animation-delay:0.290s">e</span><span style="animation-delay:0.325s">n</span><span style="animation-delay:0.360s">t</span><span style="animation-delay:0.395s">s</span><span style="animation-delay:0.430s">&nbsp;</span><span style="animation-delay:0.465s">A</span><span style="animation-delay:0.500s">c</span><span style="animation-delay:0.535s">a</span><span style="animation-delay:0.570s">d</span><span style="animation-delay:0.605s">e</span><span style="animation-delay:0.640s">m</span><span style="animation-delay:0.675s">y</span></div><div class="pl-sub">Grant Road · Mumbai</div></div>
        <div class="pl-bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
