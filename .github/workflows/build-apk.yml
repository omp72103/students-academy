name: Build Android APK
on:
  push: { paths: ['android/**', '.github/workflows/build-apk.yml'] }
  workflow_dispatch:
    inputs:
      site_url: { description: 'Website URL the app opens', required: false, default: 'https://students-academy.vercel.app' }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        run: gradle assembleDebug -PSITE_URL=${{ github.event.inputs.site_url || 'https://students-academy.vercel.app' }}
      - uses: actions/upload-artifact@v4
        with: { name: StudentsAcademy-apk, path: android/app/build/outputs/apk/debug/*.apk }
