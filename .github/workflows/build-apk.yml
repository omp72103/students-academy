name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
    inputs:
      site_url: { description: 'Website URL the app opens', required: false, default: 'https://students-academy.vercel.app' }
jobs:
  build:
    runs-on: ubuntu-24.04   # image ships with the Android SDK preinstalled
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -PSITE_URL=${{ github.event.inputs.site_url || 'https://students-academy.vercel.app' }}
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk StudentsAcademy.apk
      - uses: actions/upload-artifact@v4
        with: { name: StudentsAcademy-apk, path: android/StudentsAcademy.apk }
